name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: terminalwave
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: terminalwave.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: terminalwave
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=terminalwave-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: terminalwave-*.*
